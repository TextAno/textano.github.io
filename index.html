e text. “With layout” appears after reading a single Word, Excel, PowerPoint or OpenDocument file and keeps formatting, tables, headers and footers.","liz":true},{"k":"zip","h":"Several files as ZIP","p":"“All with layout (ZIP)” is for several Office files. “All separately (ZIP)” is for mixed files: Office keeps its layout, PDF, email and text become text files. The mapping applies to all.","liz":true},{"k":"zuordnung","h":"Save or load the mapping","p":"The mapping links placeholders and original values. As a file it allows the way back later or on another device.","liz":true},{"k":"opt_pseudo","h":"Pseudonyms","p":"When copying and saving, invented names appear instead of placeholders. The “Pseudonyms” tab shows the result.","liz":true},{"k":"namen","h":"Name list","p":"Loads a list of staff, customers or organisations (TXT, CSV, Excel, Word). These names are then always recognised, even without a salutation.","liz":true}],"shots":[{"src":"img/tool-vorschau.png","w":505,"alt":"Die Vorschau mit gelb markierten Platzhaltern."},{"src":"img/tool-pruefliste.png","w":505,"alt":"Die Prüfliste mit Hinweisen unter der Vorschau."},{"src":"img/tool-profil.png","w":280,"alt":"Die Schnellwahl mit den drei Möglichkeiten über den Häkchen."},{"src":"img/tool-layout.png","w":660,"alt":"Eine Word-Datei vor und nach dem Speichern mit Layout."}],"ds":[["Do my texts leave the computer?","No. TextAno processes everything in your browser. A security policy in the file blocks the page’s network connections (connect-src: everything blocked except the version file for the update check); there are no external libraries, no telemetry and no automatic updates. TextAno never connects to the internet on its own. The only exception is the update check, and it only runs if you expressly confirm it – only the version number is retrieved, nothing is sent. Only what you paste into an AI tool yourself goes there – you decide."],["What does TextAno store?","Only settings in this browser: appearance, mode, language, detection level, chosen AI, checkboxes, licence, acknowledgement of the notice and acceptance of the EULA and, with a licence, your own logo and colours. Never your texts or mappings. Learning mode stores names only as salted checksums. All details under Privacy."],["Is the anonymisation 100 % safe?","No. Detection is based on rules, word lists and a small model – no method finds everything. That is why TextAno shows a checklist of uncertain passages and checks before copying whether original values remain in the text. Always check the result yourself before passing it on. As long as the mapping exists, the text is pseudonymised, not anonymous (EULA section 9)."],["May I use anonymised texts in ChatGPT &amp; co.?","That is your decision. An AI service processes what you paste under its own terms and may store it. Data that was not detected reaches it in plain text. Check beforehand whether your employer, professional or official secrecy and data protection law allow it. You remain responsible for passing it on (EULA section 10)."],["I deleted the browser data – what is lost?","Settings, licence and learning state are stored only in this browser and are then gone. So keep the licence file or the reply e-mail with the licence key; with it you re-import the licence in seconds. With a licence, “Save file with licence” in the licence window creates your own TextAno file with the licence embedded; if you open this file from now on, you never have to enter the licence again after deleting the browser data. Texts are not lost, because TextAno never stores them – save results to a file yourself."]],"faq":[["Basics",[["What does TextAno do and what is it for?","TextAno replaces names, addresses, numbers and other personal data in your text with placeholders such as [PERSON_1] before you paste the text into an AI tool such as ChatGPT, Claude or Duck.ai. TextAno then translates the AI’s answer back: the placeholders are replaced with the original values again. This lets you use AI without disclosing personal data."],["How does it work?","Step 1: paste, type, import or dictate the text – TextAno anonymises it at once. Step 2: check the result (checklist, preview) and copy it or pass it to the AI with “Copy &amp; open AI”. Step 3: paste the AI’s answer – TextAno puts the original values back. More in the Guide."],["Why is TextAno a single HTML file?","A file runs in any current browser without installation, account or server. Everything TextAno needs – detection, word lists, program code – is inside the file. You can use it offline and decide yourself where it is stored."]]],["Data protection and security",[["Do my texts leave the computer?","No. TextAno processes everything in your browser. A security policy in the file blocks the page’s network connections (connect-src: everything blocked except the version file for the update check); there are no external libraries, no telemetry and no automatic updates. TextAno never connects to the internet on its own. The only exception is the update check, and it only runs if you expressly confirm it – only the version number is retrieved, nothing is sent. Only what you paste into an AI tool yourself goes there – you decide."],["What does TextAno store?","Only settings in this browser: appearance, mode, language, detection level, chosen AI, checkboxes, licence, acknowledgement of the notice and acceptance of the EULA and, with a licence, your own logo and colours. Never your texts or mappings. Learning mode stores names only as salted checksums. All details under Privacy."],["Is the anonymisation 100 % safe?","No. Detection is based on rules, word lists and a small model – no method finds everything. That is why TextAno shows a checklist of uncertain passages and checks before copying whether original values remain in the text. Always check the result yourself before passing it on. As long as the mapping exists, the text is pseudonymised, not anonymous (EULA section 9)."],["May I use anonymised texts in ChatGPT &amp; co.?","That is your decision. An AI service processes what you paste under its own terms and may store it. Data that was not detected reaches it in plain text. Check beforehand whether your employer, professional or official secrecy and data protection law allow it. You remain responsible for passing it on (EULA section 10)."],["I deleted the browser data – what is lost?","Settings, licence and learning state are stored only in this browser and are then gone. So keep the licence file or the reply e-mail with the licence key; with it you re-import the licence in seconds. With a licence, “Save file with licence” in the licence window creates your own TextAno file with the licence embedded; if you open this file from now on, you never have to enter the licence again after deleting the browser data. Texts are not lost, because TextAno never stores them – save results to a file yourself."]]],["Back after the AI",[["How does the text come back after the AI?","Paste the AI’s answer in step 3. TextAno replaces the placeholders with the original values, even if the AI changed them slightly (e.g. “[Person 1]”). If the AI delivered a Word, Excel, PowerPoint or OpenDocument file, “Restore a file” inserts the values directly into the file; the layout is kept."],["What happens when I close the window?","The placeholder mapping exists only in working memory and is gone after closing or reloading. An AI answer can then no longer be translated back. With a licence you can first save the mapping encrypted (AES-256, with password) to a file and load it again later."]]],["Licence and prices",[["What is the difference between simple mode and expert mode?","Simple mode (free mode) uses proven default settings: paste text or import .txt and .md files, anonymise, check, translate back and save. Expert mode requires a licence and offers, among other things, categories, own terms, exceptions, learning mode, import of PDF, Office and e-mail files, encrypted mapping and your own logo and colours. Basic detection, checklist and security check are the same in both modes."],["May I use the free version for business?","No. The free version is for private purposes only. Use for work, a company, an authority, a school or an association requires a licence (see EULA)."],["What does a licence cost and how do I order?","Current prices are under Licence prices – in CHF, EUR or USD, as a monthly or annual licence, for companies per employee in tiers. “Order now” prepares a complete order that you send by e-mail to \u003ca href=\"mailto:textano@protonmail.com\">textano@protonmail.com\u003c/a>. The licence arrives by e-mail; you paste it under “Licence”."],["How do I renew or add employees?","In the order window choose “Renewal”, “Switch month → year” or “Add employees”. A licence never renews automatically. When it expires, TextAno continues as the free version; your texts and the free functions remain."],["How do I pay?","You pay in the chosen currency (CHF, EUR or USD) at the price in your order. You receive the payment details with the reply to your order; the licence is issued after payment has been received."]]],["Who is behind it",[["Who is behind TextAno?","Peter Haller, an individual in Switzerland. TextAno is his private project and has no connection with his employers. More under About me."],["What principles guide TextAno?","Data protection first: everything local, no account, no tracking, no advertising, no data collection and no dependence on servers or third-party libraries. TextAno is independent and not tied to any AI provider; the AI services in the list are just shortcuts to their websites. Limits of the detection are stated openly."],["Is TextAno certified or audited?","No. TextAno is an aid, not certified, and replaces neither human checking nor legal or data protection advice."]]],["Support and updates",[["How do I get help or report an error?","By e-mail to \u003ca href=\"mailto:textano@protonmail.com\">textano@protonmail.com\u003c/a>. Support is a voluntary service (EULA section 7). Include: version number (footer), browser and device, what you did and what happened. Never send your original text – at most an invented or anonymised example that shows the error."],["How do I get updates?","TextAno never updates itself and never downloads anything from the network on its own. With “Check for updates” in the footer, you check after confirming whether a newer version exists; “Download” opens the public release folder with the current file. The licensor provides new versions at its discretion (EULA section 7). The version number is in the footer, the changes under Release Notes. Whether settings and licence carry over to the new file depends on the browser – keep your licence at hand."]]],["Technical",[["Which browsers and devices are supported?","Current versions of Chrome, Edge and Firefox on the computer and the browser on your phone. Safari is not tested systematically. Dictation only works where the browser offers speech recognition on the device itself (currently Chrome and Edge); otherwise the button stays locked."],["Which files can TextAno import?","Free: .txt and .md. With a licence also PDF, Word, Excel, PowerPoint, OpenDocument, RTF, CSV, JSON, HTML, XML, e-mails (.eml, .msg) and other text formats. You can save as text or Word, with a licence also Office files with layout."],["Which languages does TextAno know?","Interface and detection: German, French, Italian and English. The text language is detected automatically or can be chosen. Swiss data such as the AHV/AVS number, UID, number plates and postcodes are detected."],["Is TextAno accessible?","TextAno can be operated with the keyboard, has labels for screen readers and a light and dark mode. Not everything is ideal yet (e.g. small checkboxes); improvements are under way and feedback is welcome."]]],["Legal",[["Which legal texts apply?","The EULA and the Important notice. Swiss law applies, the place of jurisdiction is Baden, as far as legally permitted. Liability is excluded as far as the law allows; there is no exclusion for intent and gross negligence. In case of doubt, the wording of the EULA prevails over this FAQ."]]]],"ueb":{"titel":"About me","name":"Peter Haller","rolle":"Developer of TextAno · Baden AG, Switzerland","lead":"Since 2006 I have been working in public administration in Aargau – with tax and financial data where confidentiality is not an option but a duty. TextAno grew out of this standard: using AI without disclosing personal data.","wH":"Career","w":[["since 2012","Deputy Head of Finance, municipal administration of Mellingen"],["2006–2012","Municipal administration of Neuenhof: tax assessment expert, finance administration, finally Head of Finance"],["2005–2006","IT support (hardware and software, server-client network)"]],"aH":"Education and training","a":[["2018–2020","Swiss Federal Diploma in Finance and Accounting (zB. Zentrum Bildung)"],["2009–2010","Advanced Federal Examination for municipal managers, finance specialisation (Höhere Verwaltungsfachschule IPM)"],["2008–2009","Basic course for municipal staff in Aargau (IPM)"],["2007–2008","Accounting clerk (zB. Zentrum Bildung)"],["2005–2006","Group/team leader (SVF-ASFC), ICT Power-User SIZ, language diplomas FIRST and DELF"],["2002–2005","Commercial employee with vocational baccalaureate (zB. Zentrum Bildung)"]],"nH":"Additional roles","n":[["since 2024","Municipal representative, tax collection expert group, canton of Aargau"],["since 2021","Examiner for the federal examination “Specialist in Finance and Accounting with Federal Diploma” (Association for Higher Examinations in Accounting and Controlling)"],["since 2016","Board member (secretary), association of finance administrators of the district of Baden"],["2009–2012","Auditor, Kinderhort Neuenhof day-care centre"]],"vH":"What you can rely on","v":[["100 % local","No server, no cloud, no connection without your consent. Your texts do not leave your browser."],["Swiss provider","The licensor is an individual in Switzerland, Swiss law, place of jurisdiction Baden."],["Direct line","No call centre: your message comes straight to me."]],"li":"LinkedIn profile","hinweis":"TextAno is my private project and has no connection with my employers.","foto":"Portrait of Peter Haller"},"copy":"© 2026 Peter Haller"}}}</script>
