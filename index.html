eien, Kategorien und Schnellwahl, Optionen (Zuordnung für mehrere Texte, Originaltext entfernen, automatisches Löschen, Hinweis für die KI, Pseudonyme und Datumsverschiebung, sensible Begriffe), eigene Begriffe und Muster, Ausnahmen, Zuordnung anzeigen sowie verschlüsselt speichern und laden, Prüfprotokoll, Selbsttest und Infos zum Speichern mit Layout. Dazu eigenes Logo und eigene Farben. Die Lizenz erlaubt zudem die geschäftliche Nutzung.\u003c/p>\u003cp>\u003cstrong>Ohne Lizenz frei:\u003c/strong> Textfeld, Einlesen von Textdateien (.txt, .md), Anonymisieren, Prüfliste, Rückgängig, Kopieren &amp; KI öffnen, Rückübersetzung, Speichern als Text oder Word und «Lernstand zurücksetzen».\u003c/p>","hinweis":"\u003ch4>Wichtiger Hinweis\u003c/h4>\u003cp>TextAno unterstützt Sie dabei, personenbezogene und vertrauliche Angaben zu erkennen und zu ersetzen. Trotz sorgfältiger Entwicklung können Inhalte übersehen, falsch erkannt oder unvollständig ersetzt werden.\u003c/p>\u003cp>Prüfen Sie das Ergebnis vor jeder Weitergabe sorgfältig. Die Software ersetzt keine eigene Prüfung und garantiert keine vollständige oder rechtssichere Anonymisierung. Die Verantwortung für die abschliessende Prüfung und für den Entscheid über die Weitergabe liegt bei Ihnen.\u003c/p>","funk":[{"k":"opt_live","h":"Live anonymisieren","p":"Das Ergebnis entsteht schon beim Tippen: Nach einer kurzen Tipp-Pause läuft die Erkennung von selbst. Einfügen, Datei einlesen und geänderte Einstellungen (Kategorien, Erkennung, Textsprache, Listen) wirken sofort. «Jetzt anonymisieren» rechnet ohne Pause.","liz":false},{"k":"vorschau","h":"Vorschau und Korrektur","p":"Zeigt jede Ersetzung gelb. Klick auf einen gelben Platzhalter setzt den Originalwert zurück; steht derselbe Platzhalter mehrfach im Ergebnis, fragt das Tool: nur diese Stelle oder alle. Übersehenes markieren und als Person, Firma, Ort oder Begriff ersetzen.","liz":false},{"k":"pruefliste","h":"Prüfliste","p":"Zeigt Stellen, die nach Namen oder sensiblen Angaben aussehen, aber nicht ersetzt wurden. Klick ersetzt die Stelle, ✕ blendet sie aus. Gestrichelt heisst: unbekanntes Wort, nur ein Hinweis.","liz":false},{"k":"katStufe","h":"Kategorien: Fein oder Grob","p":"Bestimmt nur die Namen der Platzhalter, nicht was ersetzt wird. Fein (Standard) sagt der KI genau, was an einer Stelle steht, zum Beispiel [STRASSE_1], [GEBURTSDATUM_1] oder [VERSICHERTENNUMMER_1].","liz":false},{"k":"opt_leg","h":"Angaben für die KI","p":"Gibt der KI beim Kopieren eine kurze Liste mit: Mann, Frau oder unbekannt und ob ein Name Vor- und Nachname, nur Vorname oder nur Nachname ist. Dazu die Platzhalter für den Nachnamen allein.","liz":false},{"k":"auftrag","h":"Auftrag","p":"Kopiert einen fertigen Satz wie «Fasse den folgenden Text in wenigen Sätzen zusammen.» vor den Text. Die Sprache folgt der Oberfläche.","liz":false},{"k":"textLang","h":"Textsprache","p":"«Automatisch erkennen» bestimmt die Sprache des Textes und wählt die passenden Regeln. Eine feste Sprache schaltet das ab, «Alle Sprachen» nutzt alle Regeln zugleich.","liz":false},{"k":"strenge","h":"Erkennung: Normal oder Streng","p":"Normal ersetzt, was nach Personendaten aussieht; dazu gehören Wörter, die ein kleines Sprachmodell im Browser als Namen einstuft. Streng ersetzt zusätzlich jedes Wort, das nicht in der Wortliste steht, und jede fremde Schrift.","liz":false},{"k":"opt_fkt","h":"Funktionen und Ämter verallgemeinern","p":"Ersetzt politische Ämter und Leitungsfunktionen an einer genannten Institution ganz durch [FUNKTION_1], zum Beispiel «Mitglied des Einwohnerrats der Stadt Aarau», «Kantonsrätin» vor einem Namen oder «Chefarzt an der [SPITAL_1]».","liz":false},{"k":"lernen","h":"Lernmodus","p":"Das Tool merkt sich ersetzte Namen als unlesbare Prüfsummen und erkennt sie in späteren Texten auch ohne Anrede. Im selben Text gilt das schon ohne Lernmodus. Ein gelernter Nachname, der allein steht, wird [NACHNAME_1], ein gelernter Vorname [VORNAME_1].","liz":true},{"k":"begriffe","h":"Eigene Begriffe","p":"Jede Zeile wird immer ersetzt, unabhängig von Gross- und Kleinschreibung.","liz":true},{"k":"ausnahmen","h":"Ausnahmen","p":"Einträge bleiben immer stehen. Ausnahmen haben Vorrang vor allen Regeln.","liz":true},{"k":"layout","h":"Speichern und «Mit Layout»","p":"TXT und Word speichern den Text. «Mit Layout» erscheint nach dem Einlesen einer einzelnen Word-, Excel-, PowerPoint- oder OpenDocument-Datei und behält Formatierung, Tabellen, Kopf- und Fusszeilen.","liz":true},{"k":"zip","h":"Mehrere Dateien als ZIP","p":"«Alle mit Layout (ZIP)» gilt für mehrere Office-Dateien. «Alle einzeln (ZIP)» für gemischte Dateien: Office behält das Layout, PDF, E-Mail und Text kommen als Textdatei. Die Zuordnung gilt für alle.","liz":true},{"k":"zuordnung","h":"Zuordnung speichern oder laden","p":"Die Zuordnung verbindet Platzhalter und Originalwerte. Als Datei erlaubt sie den Rückweg später oder an einem anderen Gerät.","liz":true},{"k":"opt_pseudo","h":"Pseudonyme","p":"Beim Kopieren und Speichern erscheinen erfundene Namen statt Platzhalter. Der Reiter «Pseudonyme» zeigt das Ergebnis.","liz":true},{"k":"namen","h":"Namensliste","p":"Lädt eine Liste von Mitarbeitenden, Kundschaft oder Organisationen (TXT, CSV, Excel, Word). Diese Namen werden künftig immer erkannt, auch ohne Anrede.","liz":true}],"shots":[{"src":"img/tool-vorschau.png","w":505,"alt":"Die Vorschau mit gelb markierten Platzhaltern."},{"src":"img/tool-pruefliste.png","w":505,"alt":"Die Prüfliste mit Hinweisen unter der Vorschau."},{"src":"img/tool-profil.png","w":280,"alt":"Die Schnellwahl mit den drei Möglichkeiten über den Häkchen."},{"src":"img/tool-layout.png","w":660,"alt":"Eine Word-Datei vor und nach dem Speichern mit Layout."}],"ds":[["Verlassen meine Texte den Computer?","Nein. TextAno verarbeitet alles in deinem Browser. Eine Sicherheitsrichtlinie in der Datei sperrt Netzwerkverbindungen der Seite (connect-src: alles gesperrt ausser der Versionsdatei der Update-Prüfung); es gibt keine externen Bibliotheken, keine Telemetrie und keine automatischen Updates. TextAno baut nie von sich aus eine Verbindung ins Internet auf. Einzige Ausnahme ist die Update-Prüfung, und die läuft nur, wenn du sie ausdrücklich bestätigst – dabei wird nur die Versionsnummer abgerufen, nichts gesendet. Nur was du selbst in ein KI-Tool einfügst, gelangt dorthin – das bestimmst du."],["Was speichert TextAno?","Nur Einstellungen in diesem Browser: Darstellung, Modus, Sprache, Erkennungsstufe, gewählte KI, Häkchen, Lizenz, Kenntnisnahme des Hinweises und Zustimmung zur EULA sowie mit Lizenz eigenes Logo und Farben. Nie deine Texte oder Zuordnungen. Der Lernmodus speichert Namen nur als gesalzene Prüfsummen. Alle Einzelheiten unter Datenschutz."],["Ist die Anonymisierung 100 % sicher?","Nein. Die Erkennung beruht auf Regeln, Wortlisten und einem kleinen Modell – keine Methode findet alles. Darum zeigt TextAno eine Prüfliste mit unsicheren Stellen und prüft vor dem Kopieren, ob noch Originalwerte im Text stehen. Kontrolliere das Ergebnis immer selbst, bevor du es weitergibst. Solange die Zuordnung besteht, ist der Text pseudonymisiert, nicht anonym (EULA Ziff. 9)."],["Darf ich anonymisierte Texte in ChatGPT &amp; Co. verwenden?","Das entscheidest du. Ein KI-Dienst verarbeitet, was du einfügst, nach seinen eigenen Bedingungen und kann es speichern. Nicht erkannte Angaben gelangen im Klartext dorthin. Kläre vorher, ob Arbeitgeber, Berufs- oder Amtsgeheimnis und Datenschutzrecht das erlauben. Die Verantwortung für die Weitergabe bleibt bei dir (EULA Ziff. 10)."],["Ich habe die Browserdaten gelöscht – was ist weg?","Einstellungen, Lizenz und Lernstand liegen nur in diesem Browser und sind danach weg. Bewahre deshalb die Lizenzdatei oder das Antwortmail mit dem Lizenzschlüssel auf; damit liest du die Lizenz in Sekunden neu ein. Mit Lizenz speicherst du im Lizenzfenster mit «Datei mit Lizenz speichern» eine eigene TextAno-Datei mit eingebetteter Lizenz; öffnest du künftig diese Datei, musst du die Lizenz nach dem Löschen der Browserdaten nie mehr eingeben. Texte gehen nicht verloren, weil TextAno sie nie speichert – sichere Ergebnisse selbst als Datei."]],"faq":[["Grundlagen",[["Was macht TextAno und wofür ist es gedacht?","TextAno ersetzt Namen, Adressen, Nummern und weitere persönliche Angaben in deinem Text durch Platzhalter wie [PERSON_1], bevor du den Text in ein KI-Tool wie ChatGPT, Claude oder Duck.ai einfügst. Die Antwort der KI übersetzt TextAno danach zurück: Die Platzhalter werden wieder durch die Originalwerte ersetzt. So kannst du KI nutzen, ohne persönliche Daten preiszugeben."],["Wie läuft das ab?","Schritt 1: Text einfügen, tippen, einlesen oder diktieren – TextAno anonymisiert sofort. Schritt 2: Ergebnis prüfen (Prüfliste, Vorschau) und kopieren oder mit «Kopieren &amp; KI öffnen» an die KI geben. Schritt 3: Antwort der KI einfügen – TextAno setzt die Originalwerte wieder ein. Mehr dazu in der Anleitung."],["Warum ist TextAno eine einzelne HTML-Datei?","Eine Datei läuft in jedem aktuellen Browser ohne Installation, ohne Konto und ohne Server. Alles, was TextAno braucht – Erkennung, Wortlisten, Programmcode –, steckt in der Datei. Du kannst sie offline nutzen und bestimmst selbst, wo sie liegt."]]],["Datenschutz und Sicherheit",[["Verlassen meine Texte den Computer?","Nein. TextAno verarbeitet alles in deinem Browser. Eine Sicherheitsrichtlinie in der Datei sperrt Netzwerkverbindungen der Seite (connect-src: alles gesperrt ausser der Versionsdatei der Update-Prüfung); es gibt keine externen Bibliotheken, keine Telemetrie und keine automatischen Updates. TextAno baut nie von sich aus eine Verbindung ins Internet auf. Einzige Ausnahme ist die Update-Prüfung, und die läuft nur, wenn du sie ausdrücklich bestätigst – dabei wird nur die Versionsnummer abgerufen, nichts gesendet. Nur was du selbst in ein KI-Tool einfügst, gelangt dorthin – das bestimmst du."],["Was speichert TextAno?","Nur Einstellungen in diesem Browser: Darstellung, Modus, Sprache, Erkennungsstufe, gewählte KI, Häkchen, Lizenz, Kenntnisnahme des Hinweises und Zustimmung zur EULA sowie mit Lizenz eigenes Logo und Farben. Nie deine Texte oder Zuordnungen. Der Lernmodus speichert Namen nur als gesalzene Prüfsummen. Alle Einzelheiten unter Datenschutz."],["Ist die Anonymisierung 100 % sicher?","Nein. Die Erkennung beruht auf Regeln, Wortlisten und einem kleinen Modell – keine Methode findet alles. Darum zeigt TextAno eine Prüfliste mit unsicheren Stellen und prüft vor dem Kopieren, ob noch Originalwerte im Text stehen. Kontrolliere das Ergebnis immer selbst, bevor du es weitergibst. Solange die Zuordnung besteht, ist der Text pseudonymisiert, nicht anonym (EULA Ziff. 9)."],["Darf ich anonymisierte Texte in ChatGPT &amp; Co. verwenden?","Das entscheidest du. Ein KI-Dienst verarbeitet, was du einfügst, nach seinen eigenen Bedingungen und kann es speichern. Nicht erkannte Angaben gelangen im Klartext dorthin. Kläre vorher, ob Arbeitgeber, Berufs- oder Amtsgeheimnis und Datenschutzrecht das erlauben. Die Verantwortung für die Weitergabe bleibt bei dir (EULA Ziff. 10)."],["Ich habe die Browserdaten gelöscht – was ist weg?","Einstellungen, Lizenz und Lernstand liegen nur in diesem Browser und sind danach weg. Bewahre deshalb die Lizenzdatei oder das Antwortmail mit dem Lizenzschlüssel auf; damit liest du die Lizenz in Sekunden neu ein. Mit Lizenz speicherst du im Lizenzfenster mit «Datei mit Lizenz speichern» eine eigene TextAno-Datei mit eingebetteter Lizenz; öffnest du künftig diese Datei, musst du die Lizenz nach dem Löschen der Browserdaten nie mehr eingeben. Texte gehen nicht verloren, weil TextAno sie nie speichert – sichere Ergebnisse selbst als Datei."]]],["Rückweg nach der KI",[["Wie kommt der Text nach der KI zurück?","Füge die Antwort der KI in Schritt 3 ein. TextAno ersetzt die Platzhalter durch die Originalwerte, auch wenn die KI sie leicht verändert hat (z. B. «[Person 1]»). Hat die KI eine Word-, Excel-, PowerPoint- oder OpenDocument-Datei geliefert, setzt «Datei zurückübersetzen» die Werte direkt in die Datei ein; das Layout bleibt."],["Was passiert, wenn ich das Fenster schliesse?","Die Zuordnung der Platzhalter liegt nur im Arbeitsspeicher und ist nach dem Schliessen oder Neuladen weg. Danach lässt sich eine KI-Antwort nicht mehr zurückübersetzen. Mit Lizenz kannst du die Zuordnung vorher verschlüsselt (AES-256, mit Passwort) als Datei speichern und später wieder laden."]]],["Lizenz und Preise",[["Was unterscheidet Einfachmodus und Expertenmodus?","Der Einfachmodus (Gratismodus) nutzt bewährte Standardeinstellungen: Text einfügen oder .txt- und .md-Dateien einlesen, anonymisieren, prüfen, zurückübersetzen und speichern. Der Expertenmodus braucht eine Lizenz und bietet unter anderem Kategorien, eigene Begriffe, Ausnahmen, Lernmodus, Einlesen von PDF-, Office- und E-Mail-Dateien, verschlüsselte Zuordnung sowie eigenes Logo und eigene Farben. Grunderkennung, Prüfliste und Sicherheitsprüfung sind in beiden Modi gleich."],["Darf ich die Gratisversion geschäftlich nutzen?","Nein. Die Gratisversion ist nur für private Zwecke. Für die Nutzung in Beruf, Firma, Behörde, Schule oder Verein braucht es eine Lizenz (siehe EULA)."],["Was kostet eine Lizenz und wie bestelle ich?","Die aktuellen Preise findest du unter Lizenzpreise – in CHF, EUR oder USD, als Monats- oder Jahreslizenz, für Unternehmen pro Mitarbeiter mit Staffel. Mit «Jetzt bestellen» erstellst du eine fertige Bestellung und sendest sie per Mail an \u003ca href=\"mailto:textano@protonmail.com\">textano@protonmail.com\u003c/a>. Die Lizenz kommt per Mail; du fügst sie unter «Lizenz» ein."],["Wie verlängere ich oder kaufe Mitarbeiter nach?","Wähle im Bestellfenster «Verlängerung», «Wechsel Monat → Jahr» oder «Nachkauf Mitarbeiter». Eine Lizenz verlängert sich nie automatisch. Läuft sie ab, arbeitet TextAno als Gratisversion weiter; deine Texte und die Gratisfunktionen bleiben."],["Wie bezahle ich?","Du bezahlst in der gewählten Währung (CHF, EUR oder USD) zum Preis in deiner Bestellung. Die Zahlungsangaben erhältst du mit der Antwort auf deine Bestellung; die Lizenz wird nach Zahlungseingang ausgestellt."]]],["Wer steht dahinter",[["Wer steht hinter TextAno?","Peter Haller, eine Einzelperson aus der Schweiz. TextAno ist sein privates Projekt und steht in keiner Verbindung zu seinen Arbeitgebern. Mehr unter Über mich."],["Welche Haltung steht hinter TextAno?","Datenschutz zuerst: alles lokal, kein Konto, kein Tracking, keine Werbung, keine Datensammlung und keine Abhängigkeit von Servern oder fremden Bibliotheken. TextAno ist unabhängig und an keinen KI-Anbieter gebunden; die KI-Ziele in der Auswahl sind nur Abkürzungen zu deren Webseiten. Grenzen der Erkennung werden offen genannt."],["Ist TextAno zertifiziert oder geprüft?","Nein. TextAno ist ein Hilfsmittel, nicht zertifiziert, und ersetzt keine menschliche Kontrolle und keine rechtliche oder datenschutzrechtliche Beratung."]]],["Support und Updates",[["Wie erhalte ich Hilfe oder melde einen Fehler?","Per Mail an \u003ca href=\"mailto:textano@protonmail.com\">textano@protonmail.com\u003c/a>. Support ist eine freiwillige Leistung (EULA Ziff. 7). Schick mit: Versionsnummer (Fusszeile), Browser und Gerät, was du getan hast und was passiert ist. Schick nie deinen Originaltext – höchstens ein erfundenes oder anonymisiertes Beispiel, das den Fehler zeigt."],["Wie bekomme ich Updates?","TextAno aktualisiert sich nie selbst und lädt nichts von sich aus dem Netz. Mit «Nach Updates suchen» in der Fusszeile prüfst du nach deiner Bestätigung, ob es eine neuere Version gibt; «Download» öffnet den öffentlichen Release-Ordner mit der aktuellen Datei. Neue Versionen stellt der Lizenzgeber nach eigenem Ermessen bereit (EULA Ziff. 7). Die Versionsnummer steht in der Fusszeile, die Änderungen unter Release Notes. Ob Einstellungen und Lizenz in der neuen Datei übernommen werden, hängt vom Browser ab – halte die Lizenz bereit."]]],["Technik",[["Welche Browser und Geräte werden unterstützt?","Aktuelle Versionen von Chrome, Edge und Firefox am Computer sowie der Browser auf dem Handy. Safari ist nicht systematisch geprüft. Das Diktat funktioniert nur, wo der Browser die Spracherkennung auf dem Gerät selbst anbietet (derzeit Chrome und Edge); sonst bleibt der Knopf gesperrt."],["Welche Dateien kann TextAno einlesen?","Gratis: .txt und .md. Mit Lizenz zusätzlich PDF, Word, Excel, PowerPoint, OpenDocument, RTF, CSV, JSON, HTML, XML, E-Mails (.eml, .msg) und weitere Textformate. Speichern kannst du als Text oder Word, mit Lizenz Office-Dateien auch mit Layout."],["Welche Sprachen kennt TextAno?","Oberfläche und Erkennung: Deutsch, Französisch, Italienisch und Englisch. Die Textsprache wird automatisch erkannt oder lässt sich wählen. Schweizer Angaben wie AHV-Nummer, UID, Kontrollschild und Postleitzahl werden erkannt."],["Ist TextAno barrierearm?","TextAno lässt sich mit der Tastatur bedienen, hat Beschriftungen für Bildschirmleser und einen Hell- und Dunkelmodus. Noch nicht alles ist ideal (zum Beispiel kleine Kontrollkästchen); Verbesserungen laufen, Rückmeldungen sind willkommen."]]],["Rechtliches",[["Welche Rechtstexte gelten?","Die EULA und der Wichtige Hinweis. Es gilt Schweizer Recht, Gerichtsstand ist Baden, soweit gesetzlich zulässig. Die Haftung ist so weit ausgeschlossen, wie das Gesetz es erlaubt; für Absicht und grobe Fahrlässigkeit gilt kein Ausschluss. Im Zweifel geht der Wortlaut der EULA dieser FAQ vor."]]]],"ueb":{"titel":"Über mich","name":"Peter Haller","rolle":"Entwickler von TextAno · Baden AG, Schweiz","lead":"Seit 2006 arbeite ich in der öffentlichen Verwaltung im Aargau – mit Steuer- und Finanzdaten, bei denen Vertraulichkeit keine Option ist, sondern Pflicht. Mit diesem Anspruch ist TextAno entstanden: KI nutzen, ohne persönliche Daten preiszugeben.","wH":"Werdegang","w":[["seit 2012","Stv. Leiter Finanzen, Stadtverwaltung Mellingen"],["2006–2012","Gemeindeverwaltung Neuenhof: Veranlagungsexperte Steuern, Finanzverwaltung, zuletzt Leiter Finanzen"],["2005–2006","EDV-Supporter: Hard- und Software, Server-Client-Netzwerk"]],"aH":"Aus- und Weiterbildung","a":[["2018–2020","\u003cb>Eidg. Fachausweis in Finanz- und Rechnungswesen\u003c/b> · zB. Zentrum Bildung"],["2009–2010","\u003cb>Höhere Fachprüfung für Führungspersonal der Gemeinde\u003c/b>, Fachrichtung Finanzfachleute · Höhere Verwaltungsfachschule (IPM)"],["2008–2009","Basislehrgang für aargauisches Gemeindepersonal · Höhere Verwaltungsfachschule (IPM)"],["2007–2008","Sachbearbeiter Rechnungswesen · zB. Zentrum Bildung"],["2005–2006","Führungsperson Stufe Gruppe/Team (SVF-ASFC) · ICT Power-User SIZ · Sprachdiplome FIRST und DELF"],["2002–2005","Kaufmännischer Angestellter mit Berufsmaturität · zB. Zentrum Bildung"]],"nH":"Nebenämter","n":[["seit 2024","Gemeindevertretung in der Fachgruppe Steuerbezug, Kanton Aargau"],["seit 2021","\u003cb>Experte bei der eidgenössischen Prüfung\u003c/b> «Fachmann/-frau im Finanz- und Rechnungswesen mit eidg. Fachausweis» · Verein für höhere Prüfungen in Rechnungswesen und Controlling"],["seit 2016","Vorstandsmitglied (Aktuar), Finanzverwalterverband des Bezirks Baden"],["2009–2012","Revisor, Kinderhort Neuenhof"]],"vH":"Darauf kannst du dich verlassen","v":[["100 % lokal","Kein Server, keine Cloud, keine Verbindung ohne deine Zustimmung. Deine Texte verlassen deinen Browser nicht."],["Schweizer Anbieter","Lizenzgeber ist eine Einzelperson in der Schweiz, Schweizer Recht, Gerichtsstand Baden."],["Direkter Draht","Kein Callcenter: Deine Nachricht landet direkt bei mir."]],"li":"LinkedIn-Profil","hinweis":"TextAno ist mein privates Projekt und steht in keiner Verbindung zu meinen Arbeitgebern.","foto":"Porträt von Peter Haller"},"copy":"© 2026 Peter Haller"},"fr":{"t":{"lang":"fr","title":"TextAno – anonymiser les textes avant de les confier à l'IA","desc":"TextAno remplace noms, adresses et numéros par des marqueurs avant que vous ne transmettiez un texte à ChatGPT, Claude & Cie – puis rétablit la réponse. Tout en local dans le navigateur.","nav":["Fonctions","Démo","Prix","À propos","FAQ","Contact"],"skip":"Aller au contenu","theme":"Basculer clair/sombre","langLabel":"Langue","heroH":"Anonymiser les textes avant qu'ils n'aillent à l'IA – entièrement en local.","heroP":"TextAno remplace les données personnelles par des marqueurs comme [PERSON_1] avant que votre texte n'aille à ChatGPT, Claude ou Duck.ai – puis rétablit la réponse de l'IA. Sans serveur, sans compte, sans installation.","ctaDemo":"Essayer la démo","ctaMail":"Demander TextAno par e-mail","ctaRel":"Téléchargement (dossier des versions)","warumH":"Pourquoi TextAno","stepsH":"Comment ça marche","demoH":"Démo","demoP":"Essayez la détection ici même – avec un texte d'exemple inventé. La démo tourne uniquement dans votre navigateur, n'envoie rien et n'enregistre rien.","demoFrame":"Démo TextAno","funkH":"Fonctions","gratisH":"Mode simple (gratuit, privé)","expertH":"Mode expert (avec licence)","badgeFrei":"Mode simple","badgeLiz":"Mode expert","shotsH":"Aperçus de l'outil","dsH":"Protection des données","dsP":"TextAno travaille dans votre navigateur. Le fichier bloque les connexions réseau ; seule exception : la recherche de mises à jour, et uniquement après votre clic et votre confirmation.","preisH":"Prix","waehrung":"Devise","privatH":"Privé","firmaH":"Entreprises (par collaborateur)","einfach":"Mode simple (gratuit)","experte":"Mode expert","monat":"par mois","jahr":"par an","ab":"Dès","stufe":"collaborateurs","gratisW":"gratuit","preisNote":"Barème par paliers : chaque palier s'applique aux collaborateurs de ce palier. Pas de TVA. EUR/USD convertis au cours de référence de la BCE du {d}. Les entreprises ont toujours besoin du mode expert. Commande directement dans l'outil (fenêtre « Prix des licences » → Commander) ou par e-mail.","getH":"Comment obtenir TextAno","getP":"Écrivez à {m} – vous recevez le fichier TextAno actuel et, sur demande, une licence. La version actuelle se trouve aussi dans le dossier public des versions.","getMail":"Écrire un e-mail","ueberH":"À propos","faqH":"Questions fréquentes","faqSuche":"Rechercher dans les questions","faqKeine":"Aucune question ne correspond.","rechtH":"Mentions légales","rechtP":"L'utilisation de TextAno est régie par le contrat de licence utilisateur final (CLUF) et l'avis de responsabilité, que vous confirmez au premier démarrage de l'outil.","kontaktH":"Contact","stand":"Version TextAno {v}, {d}","neuTab":"(s'ouvre dans un nouvel onglet)","foot":"Ce site n'utilise ni cookies ni traceurs et ne charge rien depuis des serveurs tiers. Lors d'un accès via GitHub Pages, GitHub voit techniquement votre adresse IP."},"steps":["Coller, taper, importer ou dicter le texte – TextAno anonymise aussitôt.","Vérifier le résultat (liste de contrôle, aperçu), puis le copier ou le transmettre à l’IA avec « Copier et ouvrir l’IA ».","Coller la réponse de l’IA – TextAno rétablit les valeurs d’origine. Plus de détails dans le mode d’emploi."],"produkt":"\u003cp>\u003cstrong>TextAno prépare des textes avant leur transmission à une IA externe comme ChatGPT ou Claude.\u003c/strong> Il recherche les données personnelles et confidentielles, remplace celles trouvées par des espaces réservés neutres et rétablit ensuite les valeurs dans la réponse de l’IA.\u003c/p>\u003cul>\u003cli>\u003cstrong>Local :\u003c/strong> traitement dans votre navigateur ; le fichier bloque les connexions réseau.\u003c/li>\u003cli>\u003cstrong>Contrôle total :\u003c/strong> vous voyez chaque remplacement et pouvez l’annuler, le compléter ou le modifier.\u003c/li>\u003cli>\u003cstrong>Vérifier et corriger :\u003c/strong> liste de contrôle, marquage des oublis et indication du risque résiduel.\u003c/li>\u003cli>\u003cstrong>Indépendant :\u003c/strong> aucune interface externe d’IA ou d’anonymisation nécessaire, aucune installation.\u003c/li>\u003c/ul>\u003cp>Vos données. Votre contrôle. Votre décision.\u003cbr>L’automatisation aide. L’humain décide.\u003c/p>","gratis":"\u003ch4>Version gratuite\u003c/h4>\u003cp>Vous utilisez gratuitement le mode simple à des fins privées : coller du texte ou importer des fichiers texte (.txt, .md), anonymiser, vérifier, retraduire et enregistrer en texte ou en Word. Pour l’usage professionnel (profession, entreprise, autorité, école, association), une licence est nécessaire ; elle débloque en outre le mode expert, avec le mode d’apprentissage, l’import de fichiers PDF, Word, Excel, PowerPoint, OpenDocument, RTF et e-mail ainsi que le logo et les couleurs personnalisés. La détection de base, le contrôle de sécurité et les avertissements sont les mêmes dans la version gratuite ; les noms appris n’agissent qu’avec une licence. Le traitement reste local.\u003c/p>\u003cp>Commander une licence : \u003ca href=\"mailto:textano@protonmail.com\">textano@protonmail.com\u003c/a> · \u003ca href=\"#preise\">Prix des licences et commande\u003c/a>\u003c/p>","expert":"\u003cp>\u003cstrong>Mode expert (avec licence) :\u003c/strong> mode d’apprentissage (apprendre en local, gérer l’apprentissage, liste de noms), import de fichiers PDF, Word, Excel, PowerPoint, OpenDocument, RTF, e-mail et CSV, catégories et choix rapide, options (correspondance pour plusieurs textes, retirer le texte original, effacement automatique, consigne pour l’IA, pseudonymes et décalage des dates, termes sensibles), termes et motifs personnels, exceptions, affichage de la correspondance et enregistrement chiffré ou chargement, procès-verbal de contrôle, autotest et infos sur l’enregistrement avec mise en page. En plus : logo et couleurs personnalisés. La licence autorise en outre l’usage professionnel.\u003c/p>\u003cp>\u003cstrong>Gratuit sans licence :\u003c/strong> champ de texte, import de fichiers texte (.txt, .md), anonymisation, liste de contrôle, annuler, copier et ouvrir l’IA, retraduction, enregistrement en texte ou en Word et « Réinitialiser l’apprentissage ».\u003c/p>","hinweis":"\u003ch4>Avis important\u003c/h4>\u003cp>TextAno vous aide à détecter et à remplacer des données personnelles et confidentielles. Malgré un développement soigné, des contenus peuvent être omis, mal reconnus ou remplacés de manière incomplète.\u003c/p>\u003cp>Vérifiez soigneusement le résultat avant toute transmission. Le logiciel ne remplace pas votre propre contrôle et ne garantit pas une anonymisation complète ou juridiquement sûre. La responsabilité du contrôle final et de la décision de transmettre vous incombe.\u003c/p>","funk":[{"k":"opt_live","h":"Anonymiser en direct","p":"Le résultat se crée pendant la saisie : après une courte pause de frappe, la détection démarre d’elle-même. Coller, lire un fichier et modifier les réglages (catégories, détection, langue du texte, listes) agissent tout de suite.","liz":false},{"k":"vorschau","h":"Aperçu et correction","p":"Montre chaque remplacement en jaune. Un clic sur un espace réservé jaune rétablit la valeur d’origine ; si le même espace réservé figure plusieurs fois dans le résultat, l’outil demande : seulement cet endroit ou tous.","liz":false},{"k":"pruefliste","h":"Liste de contrôle","p":"Montre les passages qui ressemblent à des noms ou à des données sensibles, mais n’ont pas été remplacés. Un clic remplace, ✕ masque. Pointillé : mot inconnu, simple indice.","liz":false},{"k":"katStufe","h":"Catégories : fines ou larges","p":"Détermine seulement le nom des espaces réservés, pas ce qui est remplacé. « Fines » (par défaut) indique précisément à l’IA ce qui se trouve à un endroit, par exemple [STRASSE_1], [GEBURTSDATUM_1] ou [VERSICHERTENNUMMER_1].","liz":false},{"k":"opt_leg","h":"Indications pour l’IA","p":"Ajoute à la copie une courte liste pour l’IA : homme, femme ou inconnu, et si un nom comprend prénom et nom, le prénom seul ou le nom seul. Avec les espaces réservés du nom seul.","liz":false},{"k":"auftrag","h":"Consigne","p":"Copie une phrase prête comme « Résume le texte suivant en quelques phrases. » devant le texte. La langue suit l’interface.","liz":false},{"k":"textLang","h":"Langue du texte","p":"« Détection automatique » détermine la langue du texte et choisit les règles adaptées. Une langue fixe désactive cela, « Toutes les langues » utilise toutes les règles.","liz":false},{"k":"strenge","h":"Détection : normale ou stricte","p":"Normal remplace ce qui ressemble à des données personnelles, y compris les mots qu’un petit modèle de langue dans le navigateur classe comme noms. Stricte remplace en plus chaque mot absent de la liste de mots et toute écriture étrangère.","liz":false},{"k":"opt_fkt","h":"Généraliser fonctions et mandats","p":"Remplace entièrement les mandats politiques et les fonctions dirigeantes dans une institution nommée par [FUNKTION_1], par exemple « membre du Grand Conseil », « Kantonsrätin » devant un nom ou « médecin chef au [SPITAL_1] ».","liz":false},{"k":"lernen","h":"Mode apprentissage","p":"L’outil retient les noms remplacés sous forme de sommes de contrôle illisibles et les reconnaît dans les textes suivants, même sans civilité. Dans un même texte, c’est déjà le cas sans le mode apprentissage.","liz":true},{"k":"begriffe","h":"Termes personnalisés","p":"Chaque ligne est toujours remplacée, sans tenir compte des majuscules.","liz":true},{"k":"ausnahmen","h":"Exceptions","p":"Les entrées restent toujours. Les exceptions ont priorité sur toutes les règles.","liz":true},{"k":"layout","h":"Enregistrer et « Avec mise en page »","p":"TXT et Word enregistrent le texte. « Avec mise en page » apparaît après la lecture d’un seul fichier Word, Excel, PowerPoint ou OpenDocument et garde formatage, tableaux, en-têtes et pieds de page.","liz":true},{"k":"zip","h":"Plusieurs fichiers en ZIP","p":"« Tous avec mise en page (ZIP) » vaut pour plusieurs fichiers Office. « Tous séparément (ZIP) » pour des fichiers mixtes : Office garde la mise en page, PDF, e-mail et texte deviennent des fichiers texte. L’attribution vaut pour tous.","liz":true},{"k":"zuordnung","h":"Enregistrer ou charger l’attribution","p":"L’attribution relie espaces réservés et valeurs d’origine. Sous forme de fichier, elle permet le retour plus tard ou sur un autre appareil.","liz":true},{"k":"opt_pseudo","h":"Pseudonymes","p":"À la copie et à l’enregistrement, des noms inventés remplacent les espaces réservés. L’onglet « Pseudonymes » montre le résultat.","liz":true},{"k":"namen","h":"Liste de noms","p":"Charge une liste de collaborateurs, clients ou organisations (TXT, CSV, Excel, Word). Ces noms sont ensuite toujours reconnus, même sans civilité.","liz":true}],"shots":[{"src":"img/tool-vorschau.png","w":505,"alt":"Die Vorschau mit gelb markierten Platzhaltern."},{"src":"img/tool-pruefliste.png","w":505,"alt":"Die Prüfliste mit Hinweisen unter der Vorschau."},{"src":"img/tool-profil.png","w":280,"alt":"Die Schnellwahl mit den drei Möglichkeiten über den Häkchen."},{"src":"img/tool-layout.png","w":660,"alt":"Eine Word-Datei vor und nach dem Speichern mit Layout."}],"ds":[["Mes textes quittent-ils l’ordinateur ?","Non. TextAno traite tout dans votre navigateur. Une politique de sécurité dans le fichier bloque les connexions réseau de la page (connect-src : tout est bloqué sauf le fichier de version de la vérification des mises à jour) ; il n’y a ni bibliothèque externe, ni télémétrie, ni mise à jour automatique. TextAno n’établit jamais de lui-même une connexion à Internet. Seule exception : la vérification des mises à jour, qui n’a lieu que si vous la confirmez expressément – seul le numéro de version est alors récupéré, rien n’est envoyé. Seul ce que vous collez vous-même dans un outil d’IA y parvient – c’est vous qui décidez."],["Qu’est-ce que TextAno enregistre ?","Uniquement des réglages dans ce navigateur : affichage, mode, langue, niveau de détection, IA choisie, cases cochées, licence, prise de connaissance de l’avis et acceptation du CLUF, ainsi qu’avec licence le logo et les couleurs personnels. Jamais vos textes ni vos correspondances. Le mode d’apprentissage n’enregistre les noms que sous forme de sommes de contrôle salées. Tous les détails sous Protection des données."],["L’anonymisation est-elle sûre à 100 % ?","Non. La détection repose sur des règles, des listes de mots et un petit modèle – aucune méthode ne trouve tout. C’est pourquoi TextAno affiche une liste de contrôle des passages incertains et vérifie avant la copie s’il reste des valeurs d’origine dans le texte. Contrôlez toujours le résultat vous-même avant de le transmettre. Tant que la correspondance existe, le texte est pseudonymisé, pas anonyme (CLUF ch. 9)."],["Puis-je utiliser des textes anonymisés dans ChatGPT &amp; Cie ?","C’est à vous de décider. Un service d’IA traite ce que vous collez selon ses propres conditions et peut l’enregistrer. Les données non détectées y parviennent en clair. Vérifiez au préalable si votre employeur, le secret professionnel ou de fonction et le droit de la protection des données le permettent. La responsabilité de la transmission vous incombe (CLUF ch. 10)."],["J’ai effacé les données du navigateur – qu’est-ce qui est perdu ?","Les réglages, la licence et l’apprentissage se trouvent uniquement dans ce navigateur et sont alors perdus. Conservez donc le fichier de licence ou l’e-mail de réponse avec la clé de licence ; vous réimportez ainsi la licence en quelques secondes. Avec licence, « Enregistrer le fichier avec licence » dans la fenêtre de licence crée votre propre fichier TextAno avec la licence intégrée ; si vous ouvrez désormais ce fichier, vous n’aurez plus jamais à saisir la licence après avoir effacé les données du navigateur. Les textes ne sont pas perdus, car TextAno ne les enregistre jamais – sauvegardez vous-même les résultats dans un fichier."]],"faq":[["Principes",[["Que fait TextAno et à quoi sert-il ?","TextAno remplace les noms, adresses, numéros et autres données personnelles de votre texte par des espaces réservés comme [PERSON_1], avant que vous ne colliez le texte dans un outil d’IA comme ChatGPT, Claude ou Duck.ai. Ensuite, TextAno retraduit la réponse de l’IA : les espaces réservés sont remplacés par les valeurs d’origine. Vous utilisez ainsi l’IA sans divulguer de données personnelles."],["Comment cela fonctionne-t-il ?","Étape 1 : coller, taper, importer ou dicter le texte – TextAno anonymise aussitôt. Étape 2 : vérifier le résultat (liste de contrôle, aperçu), puis le copier ou le transmettre à l’IA avec « Copier et ouvrir l’IA ». Étape 3 : coller la réponse de l’IA – TextAno rétablit les valeurs d’origine. Plus de détails dans le mode d’emploi."],["Pourquoi TextAno est-il un seul fichier HTML ?","Un fichier fonctionne dans tout navigateur récent, sans installation, sans compte et sans serveur. Tout ce dont TextAno a besoin – détection, listes de mots, code – se trouve dans le fichier. Vous pouvez l’utiliser hors ligne et décidez vous-même où il se trouve."]]],["Protection des données et sécurité",[["Mes textes quittent-ils l’ordinateur ?","Non. TextAno traite tout dans votre navigateur. Une politique de sécurité dans le fichier bloque les connexions réseau de la page (connect-src : tout est bloqué sauf le fichier de version de la vérification des mises à jour) ; il n’y a ni bibliothèque externe, ni télémétrie, ni mise à jour automatique. TextAno n’établit jamais de lui-même une connexion à Internet. Seule exception : la vérification des mises à jour, qui n’a lieu que si vous la confirmez expressément – seul le numéro de version est alors récupéré, rien n’est envoyé. Seul ce que vous collez vous-même dans un outil d’IA y parvient – c’est vous qui décidez."],["Qu’est-ce que TextAno enregistre ?","Uniquement des réglages dans ce navigateur : affichage, mode, langue, niveau de détection, IA choisie, cases cochées, licence, prise de connaissance de l’avis et acceptation du CLUF, ainsi qu’avec licence le logo et les couleurs personnels. Jamais vos textes ni vos correspondances. Le mode d’apprentissage n’enregistre les noms que sous forme de sommes de contrôle salées. Tous les détails sous Protection des données."],["L’anonymisation est-elle sûre à 100 % ?","Non. La détection repose sur des règles, des listes de mots et un petit modèle – aucune méthode ne trouve tout. C’est pourquoi TextAno affiche une liste de contrôle des passages incertains et vérifie avant la copie s’il reste des valeurs d’origine dans le texte. Contrôlez toujours le résultat vous-même avant de le transmettre. Tant que la correspondance existe, le texte est pseudonymisé, pas anonyme (CLUF ch. 9)."],["Puis-je utiliser des textes anonymisés dans ChatGPT &amp; Cie ?","C’est à vous de décider. Un service d’IA traite ce que vous collez selon ses propres conditions et peut l’enregistrer. Les données non détectées y parviennent en clair. Vérifiez au préalable si votre employeur, le secret professionnel ou de fonction et le droit de la protection des données le permettent. La responsabilité de la transmission vous incombe (CLUF ch. 10)."],["J’ai effacé les données du navigateur – qu’est-ce qui est perdu ?","Les réglages, la licence et l’apprentissage se trouvent uniquement dans ce navigateur et sont alors perdus. Conservez donc le fichier de licence ou l’e-mail de réponse avec la clé de licence ; vous réimportez ainsi la licence en quelques secondes. Avec licence, « Enregistrer le fichier avec licence » dans la fenêtre de licence crée votre propre fichier TextAno avec la licence intégrée ; si vous ouvrez désormais ce fichier, vous n’aurez plus jamais à saisir la licence après avoir effacé les données du navigateur. Les textes ne sont pas perdus, car TextAno ne les enregistre jamais – sauvegardez vous-même les résultats dans un fichier."]]],["Retour après l’IA",[["Comment le texte revient-il après l’IA ?","Collez la réponse de l’IA à l’étape 3. TextAno remplace les espaces réservés par les valeurs d’origine, même si l’IA les a légèrement modifiés (p. ex. « [Person 1] »). Si l’IA a fourni un fichier Word, Excel, PowerPoint ou OpenDocument, « Retraduire un fichier » insère les valeurs directement dans le fichier ; la mise en page est conservée."],["Que se passe-t-il si je ferme la fenêtre ?","La correspondance des espaces réservés n’existe que dans la mémoire de travail et disparaît à la fermeture ou au rechargement. Une réponse de l’IA ne peut alors plus être retraduite. Avec licence, vous pouvez auparavant enregistrer la correspondance chiffrée (AES-256, avec mot de passe) dans un fichier et la recharger plus tard."]]],["Licence et prix",[["Quelle est la différence entre mode simple et mode expert ?","Le mode simple (mode gratuit) utilise des réglages standard éprouvés : coller du texte ou importer des fichiers .txt et .md, anonymiser, vérifier, retraduire et enregistrer. Le mode expert nécessite une licence et offre notamment des catégories, des termes propres, des exceptions, le mode d’apprentissage, l’import de fichiers PDF, Office et e-mail, la correspondance chiffrée ainsi que logo et couleurs personnels. La détection de base, la liste de contrôle et la vérification de sécurité sont les mêmes dans les deux modes."],["Puis-je utiliser la version gratuite à titre professionnel ?","Non. La version gratuite est réservée à un usage privé. Pour un usage dans la profession, l’entreprise, l’administration, l’école ou une association, une licence est nécessaire (voir CLUF)."],["Combien coûte une licence et comment commander ?","Les prix actuels se trouvent sous Prix des licences – en CHF, EUR ou USD, en licence mensuelle ou annuelle, pour les entreprises par collaborateur avec paliers. « Commander maintenant » prépare une commande complète que vous envoyez par e-mail à \u003ca href=\"mailto:textano@protonmail.com\">textano@protonmail.com\u003c/a>. La licence arrive par e-mail ; vous la collez sous « Licence »."],["Comment prolonger ou ajouter des collaborateurs ?","Choisissez dans la fenêtre de commande « Renouvellement », « Passage mois → année » ou « Collaborateurs supplémentaires ». Une licence ne se prolonge jamais automatiquement. À son échéance, TextAno continue en version gratuite ; vos textes et les fonctions gratuites restent."],["Comment payer ?","Vous payez dans la devise choisie (CHF, EUR ou USD) au prix indiqué dans votre commande. Vous recevez les données de paiement avec la réponse à votre commande ; la licence est émise après réception du paiement."]]],["Qui est derrière TextAno",[["Qui est derrière TextAno ?","Peter Haller, une personne individuelle en Suisse. TextAno est son projet privé et n’a aucun lien avec ses employeurs. Plus d’informations sous À propos de moi."],["Quelle philosophie guide TextAno ?","La protection des données d’abord : tout en local, pas de compte, pas de suivi, pas de publicité, pas de collecte de données et aucune dépendance à des serveurs ou à des bibliothèques tierces. TextAno est indépendant et lié à aucun fournisseur d’IA ; les services d’IA de la liste ne sont que des raccourcis vers leurs sites. Les limites de la détection sont indiquées ouvertement."],["TextAno est-il certifié ou audité ?","Non. TextAno est un outil d’aide, non certifié, qui ne remplace ni le contrôle humain ni un conseil juridique ou en protection des données."]]],["Support et mises à jour",[["Comment obtenir de l’aide ou signaler une erreur ?","Par e-mail à \u003ca href=\"mailto:textano@protonmail.com\">textano@protonmail.com\u003c/a>. Le support est une prestation volontaire (CLUF ch. 7). Indiquez : numéro de version (pied de page), navigateur et appareil, ce que vous avez fait et ce qui s’est passé. N’envoyez jamais votre texte original – tout au plus un exemple inventé ou anonymisé qui montre l’erreur."],["Comment obtenir les mises à jour ?","TextAno ne se met jamais à jour tout seul et ne télécharge rien de lui-même depuis le réseau. Avec « Rechercher des mises à jour » dans le pied de page, vous vérifiez après confirmation s’il existe une version plus récente ; « Télécharger » ouvre le dossier public des versions avec le fichier actuel. Le donneur de licence fournit de nouvelles versions à sa discrétion (CLUF ch. 7). Le numéro de version figure dans le pied de page, les changements sous Release Notes. La reprise des réglages et de la licence dans le nouveau fichier dépend du navigateur – gardez la licence à portée de main."]]],["Technique",[["Quels navigateurs et appareils sont pris en charge ?","Les versions récentes de Chrome, Edge et Firefox sur ordinateur ainsi que le navigateur du téléphone. Safari n’est pas testé de manière systématique. La dictée ne fonctionne que si le navigateur propose la reconnaissance vocale sur l’appareil même (actuellement Chrome et Edge) ; sinon le bouton reste bloqué."],["Quels fichiers TextAno peut-il importer ?","Gratuitement : .txt et .md. Avec licence en plus : PDF, Word, Excel, PowerPoint, OpenDocument, RTF, CSV, JSON, HTML, XML, e-mails (.eml, .msg) et d’autres formats texte. Vous pouvez enregistrer en texte ou en Word, avec licence aussi les fichiers Office avec mise en page."],["Quelles langues TextAno connaît-il ?","Interface et détection : allemand, français, italien et anglais. La langue du texte est détectée automatiquement ou peut être choisie. Les données suisses comme le numéro AVS, l’IDE, les plaques d’immatriculation et les NPA sont détectées."],["TextAno est-il accessible ?","TextAno se commande au clavier, possède des libellés pour les lecteurs d’écran ainsi qu’un mode clair et sombre. Tout n’est pas encore idéal (p. ex. petites cases à cocher) ; des améliorations sont en cours, vos retours sont les bienvenus."]]],["Juridique",[["Quels textes juridiques s’appliquent ?","Le CLUF et l’Avis important. Le droit suisse s’applique, le for est à Baden, dans la mesure permise par la loi. La responsabilité est exclue dans la mesure permise par la loi ; il n’y a pas d’exclusion pour le dol et la faute grave. En cas de doute, le texte du CLUF prime sur cette FAQ."]]]],"ueb":{"titel":"À propos de moi","name":"Peter Haller","rolle":"Développeur de TextAno · Baden AG, Suisse","lead":"Depuis 2006, je travaille dans l’administration publique en Argovie – avec des données fiscales et financières pour lesquelles la confidentialité n’est pas une option, mais une obligation. C’est avec cette exigence qu’est né TextAno : utiliser l’IA sans divulguer de données personnelles.","wH":"Parcours","w":[["depuis 2012","Chef des finances adjoint, administration de la ville de Mellingen"],["2006–2012","Administration communale de Neuenhof : expert en taxation fiscale, administration des finances, en dernier lieu chef des finances"],["2005–2006","Support informatique (matériel et logiciels, réseau serveur-client)"]],"aH":"Formation et formation continue","a":[["2018–2020","Brevet fédéral de spécialiste en finance et comptabilité (zB. Zentrum Bildung)"],["2009–2010","Examen professionnel supérieur pour cadres communaux, orientation spécialistes des finances (Höhere Verwaltungsfachschule IPM)"],["2008–2009","Cours de base pour le personnel communal argovien (IPM)"],["2007–2008","Employé spécialisé en comptabilité (zB. Zentrum Bildung)"],["2005–2006","Cadre de niveau groupe/équipe (SVF-ASFC), ICT Power-User SIZ, diplômes de langue FIRST et DELF"],["2002–2005","Employé de commerce avec maturité professionnelle (zB. Zentrum Bildung)"]],"nH":"Fonctions annexes","n":[["depuis 2024","Représentation des communes, groupe spécialisé perception des impôts, canton d’Argovie"],["depuis 2021","Expert à l’examen fédéral « Spécialiste en finance et comptabilité avec brevet fédéral » (Association pour les examens supérieurs en comptabilité et controlling)"],["depuis 2016","Membre du comité (secrétaire), association des administrateurs des finances du district de Baden"],["2009–2012","Réviseur, garderie Kinderhort Neuenhof"]],"vH":"Sur quoi vous pouvez compter","v":[["100 % local","Pas de serveur, pas de cloud, aucune connexion sans votre accord. Vos textes ne quittent pas votre navigateur."],["Fournisseur suisse","Le donneur de licence est une personne individuelle en Suisse, droit suisse, for à Baden."],["Contact direct","Pas de centre d’appels : votre message m’arrive directement."]],"li":"Profil LinkedIn","hinweis":"TextAno est mon projet privé et n’a aucun lien avec mes employeurs.","foto":"Portrait de Peter Haller"},"copy":"© 2026 Peter Haller"},"it":{"t":{"lang":"it","title":"TextAno – anonimizzare i testi prima di darli all'IA","desc":"TextAno sostituisce nomi, indirizzi e numeri con segnaposto prima che tu dia un testo a ChatGPT, Claude & Co. – e poi ripristina la risposta. Tutto in locale nel browser.","nav":["Funzioni","Demo","Prezzi","Chi sono","FAQ","Contatto"],"skip":"Vai al contenuto","theme":"Cambia chiaro/scuro","langLabel":"Lingua","heroH":"Anonimizzare i testi prima che vadano all'IA – tutto in locale.","heroP":"TextAno sostituisce i dati personali con segnaposto come [PERSON_1] prima che il tuo testo vada a ChatGPT, Claude o Duck.ai – e poi ripristina la risposta dell'IA. Senza server, senza account, senza installazione.","ctaDemo":"Prova la demo","ctaMail":"Richiedi TextAno per e-mail","ctaRel":"Download (cartella delle versioni)","warumH":"Perché TextAno","stepsH":"Come funziona","demoH":"Demo","demoP":"Prova il riconoscimento direttamente qui – con un testo di esempio inventato. La demo funziona solo nel tuo browser, non invia nulla e non salva nulla.","demoFrame":"Demo di TextAno","funkH":"Funzioni","gratisH":"Modalità semplice (gratuita, privata)","expertH":"Modalità esperto (con licenza)","badgeFrei":"Modalità semplice","badgeLiz":"Modalità esperto","shotsH":"Uno sguardo allo strumento","dsH":"Protezione dei dati","dsP":"TextAno lavora nel tuo browser. Il file blocca le connessioni di rete; unica eccezione è la verifica degli aggiornamenti, e solo dopo il tuo clic e la tua conferma.","preisH":"Prezzi","waehrung":"Valuta","privatH":"Privati","firmaH":"Aziende (per collaboratore)","einfach":"Modalità semplice (gratuita)","experte":"Modalità esperto","monat":"al mese","jahr":"all'anno","ab":"Da","stufe":"collaboratori","gratisW":"gratis","preisNote":"Scala a scaglioni: ogni scaglione vale per i collaboratori di quello scaglione. Senza IVA. EUR/USD convertiti al cambio di riferimento BCE del {d}. Le aziende necessitano sempre della modalità esperto. Ordina direttamente nello strumento (finestra «Prezzi delle licenze» → Ordina) o per e-mail.","getH":"Come ottenere TextAno","getP":"Scrivi a {m} – riceverai il file TextAno attuale e, se lo desideri, una licenza. La versione attuale si trova anche nella cartella pubblica delle versioni.","getMail":"Scrivi un'e-mail","ueberH":"Chi sono","faqH":"Domande frequenti","faqSuche":"Cerca nelle domande","faqKeine":"Nessuna domanda corrisponde.","rechtH":"Note legali","rechtP":"L'uso di TextAno è disciplinato dal contratto di licenza con l'utente finale (EULA) e dall'avviso di responsabilità, che confermi al primo avvio dello strumento.","kontaktH":"Contatto","stand":"Versione TextAno {v}, {d}","neuTab":"(si apre in una nuova scheda)","foot":"Questo sito non usa cookie né tracker e non carica nulla da server di terzi. Con l'accesso tramite GitHub Pages, GitHub vede per motivi tecnici il tuo indirizzo IP."},"steps":["Incollare, digitare, importare o dettare il testo – TextAno anonimizza subito.","Verificare il risultato (lista di controllo, anteprima) e copiarlo o passarlo all’IA con «Copia e apri l’IA».","Incollare la risposta dell’IA – TextAno reinserisce i valori originali. Maggiori dettagli nelle Istruzioni."],"produkt":"\u003cp>\u003cstrong>TextAno prepara i testi prima che vengano trasmessi a un’IA esterna come ChatGPT o Claude.\u003c/strong> Cerca dati personali e confidenziali, sostituisce quelli trovati con segnaposto neutri e reinserisce poi i valori nella risposta dell’IA.\u003c/p>\u003cul>\u003cli>\u003cstrong>Locale:\u003c/strong> elaborazione nel Suo browser; il file blocca le connessioni di rete.\u003c/li>\u003cli>\u003cstrong>Pieno controllo:\u003c/strong> vede ogni sostituzione e può annullarla, completarla o modificarla.\u003c/li>\u003cli>\u003cstrong>Controllare e correggere:\u003c/strong> lista di controllo, marcatura di quanto tralasciato e indicazione del rischio residuo.\u003c/li>\u003cli>\u003cstrong>Indipendente:\u003c/strong> nessuna interfaccia esterna di IA o di anonimizzazione necessaria, nessuna installazione.\u003c/li>\u003c/ul>\u003cp>I Suoi dati. Il Suo controllo. La Sua decisione.\u003cbr>L’automazione aiuta. L’essere umano decide.\u003c/p>","gratis":"\u003ch4>Versione gratuita\u003c/h4>\u003cp>Usa gratuitamente la modalità semplice per scopi privati: incollare testo o importare file di testo (.txt, .md), anonimizzare, verificare, ritradurre e salvare come testo o Word. Per l’uso professionale (professione, azienda, autorità, scuola, associazione) è necessaria una licenza; sblocca inoltre la modalità esperto, con la modalità di apprendimento, l’importazione di file PDF, Word, Excel, PowerPoint, OpenDocument, RTF ed e-mail nonché logo e colori propri. Riconoscimento di base, controllo di sicurezza e avvisi sono gli stessi nella versione gratuita; i nomi appresi agiscono solo con licenza. L’elaborazione resta locale.\u003c/p>\u003cp>Ordinare una licenza: \u003ca href=\"mailto:textano@protonmail.com\">textano@protonmail.com\u003c/a> · \u003ca href=\"#preise\">Prezzi delle licenze e ordine\u003c/a>\u003c/p>","expert":"\u003cp>\u003cstrong>Modalità esperto (con licenza):\u003c/strong> modalità di apprendimento (imparare localmente, gestire l’apprendimento, elenco di nomi), importazione di file PDF, Word, Excel, PowerPoint, OpenDocument, RTF, e-mail e CSV, categorie e selezione rapida, opzioni (corrispondenza per più testi, rimuovere il testo originale, cancellazione automatica, indicazione per l’IA, pseudonimi e spostamento delle date, termini sensibili), termini e modelli propri, eccezioni, visualizzazione della corrispondenza e salvataggio cifrato o caricamento, verbale di controllo, autotest e informazioni sul salvataggio con layout. Inoltre logo e colori propri. La licenza consente inoltre l’uso professionale.\u003c/p>\u003cp>\u003cstrong>Gratis senza licenza:\u003c/strong> campo di testo, importazione di file di testo (.txt, .md), anonimizzazione, lista di controllo, annulla, copia e apri l’IA, ritraduzione, salvataggio come testo o Word e «Reimposta apprendimento».\u003c/p>","hinweis":"\u003ch4>Avviso importante\u003c/h4>\u003cp>TextAno La aiuta a riconoscere e sostituire dati personali e confidenziali. Nonostante uno sviluppo accurato, alcuni contenuti possono essere tralasciati, riconosciuti in modo errato o sostituiti in modo incompleto.\u003c/p>\u003cp>Controlli attentamente il risultato prima di ogni trasmissione. Il software non sostituisce il Suo controllo e non garantisce un’anonimizzazione completa o giuridicamente sicura. La responsabilità del controllo finale e della decisione di trasmettere spetta a Lei.\u003c/p>","funk":[{"k":"opt_live","h":"Anonimizza in diretta","p":"Il risultato nasce già durante la digitazione: dopo una breve pausa il riconoscimento parte da solo. Incollare, leggere un file e modificare le impostazioni (categorie, riconoscimento, lingua del testo, liste) agiscono subito.","liz":false},{"k":"vorschau","h":"Anteprima e correzione","p":"Mostra ogni sostituzione in giallo. Un clic su un segnaposto giallo ripristina il valore originale; se lo stesso segnaposto compare più volte nel risultato, lo strumento chiede: solo questo punto o tutti.","liz":false},{"k":"pruefliste","h":"Lista di controllo","p":"Mostra i punti che sembrano nomi o dati sensibili ma non sono stati sostituiti. Un clic sostituisce, ✕ nasconde. Tratteggiato: parola sconosciuta, solo un indizio.","liz":false},{"k":"katStufe","h":"Categorie: fini o ampie","p":"Determina solo il nome dei segnaposto, non ciò che viene sostituito. «Fini» (predefinito) dice all’IA esattamente cosa c’è in un punto, per esempio [STRASSE_1], [GEBURTSDATUM_1] o [VERSICHERTENNUMMER_1].","liz":false},{"k":"opt_leg","h":"Indicazioni per l’IA","p":"Aggiunge alla copia un breve elenco per l’IA: uomo, donna o sconosciuto e se un nome è nome e cognome, solo nome o solo cognome. Con i segnaposto per il solo cognome.","liz":false},{"k":"auftrag","h":"Istruzione","p":"Copia una frase pronta come «Riassumi il testo seguente in poche frasi.» davanti al testo. La lingua segue l’interfaccia.","liz":false},{"k":"textLang","h":"Lingua del testo","p":"«Rilevamento automatico» determina la lingua del testo e sceglie le regole adatte. Una lingua fissa lo disattiva, «Tutte le lingue» usa tutte le regole.","liz":false},{"k":"strenge","h":"Riconoscimento: normale o rigoroso","p":"Normale sostituisce ciò che sembra un dato personale, comprese le parole che un piccolo modello linguistico nel browser classifica come nomi. Rigoroso sostituisce inoltre ogni parola assente dall’elenco e ogni scrittura straniera.","liz":false},{"k":"opt_fkt","h":"Generalizzare funzioni e cariche","p":"Sostituisce interamente le cariche politiche e le funzioni dirigenziali in un’istituzione nominata con [FUNKTION_1], ad esempio «membro del consiglio comunale», «Kantonsrätin» davanti a un nome o «primario presso [SPITAL_1]».","liz":false},{"k":"lernen","h":"Modalità di apprendimento","p":"Lo strumento memorizza i nomi sostituiti come somme di controllo illeggibili e li riconosce nei testi successivi anche senza appellativo. Nello stesso testo questo avviene già senza la modalità di apprendimento.","liz":true},{"k":"begriffe","h":"Termini personalizzati","p":"Ogni riga viene sempre sostituita, senza distinguere maiuscole e minuscole.","liz":true},{"k":"ausnahmen","h":"Eccezioni","p":"Le voci restano sempre. Le eccezioni hanno la precedenza su tutte le regole.","liz":true},{"k":"layout","h":"Salvare e «Con layout»","p":"TXT e Word salvano il testo. «Con layout» compare dopo la lettura di un singolo file Word, Excel, PowerPoint od OpenDocument e mantiene formattazione, tabelle, intestazioni e piè di pagina.","liz":true},{"k":"zip","h":"Più file come ZIP","p":"«Tutti con layout (ZIP)» vale per più file Office. «Tutti separati (ZIP)» per file misti: Office mantiene il layout, PDF, e-mail e testo diventano file di testo. L’assegnazione vale per tutti.","liz":true},{"k":"zuordnung","h":"Salvare o caricare l’assegnazione","p":"L’assegnazione collega segnaposto e valori originali. Come file permette il ritorno più tardi o su un altro dispositivo.","liz":true},{"k":"opt_pseudo","h":"Pseudonimi","p":"Copiando e salvando compaiono nomi inventati al posto dei segnaposto. La scheda «Pseudonimi» mostra il risultato.","liz":true},{"k":"namen","h":"Elenco di nomi","p":"Carica un elenco di collaboratori, clienti od organizzazioni (TXT, CSV, Excel, Word). Questi nomi vengono poi sempre riconosciuti, anche senza appellativo.","liz":true}],"shots":[{"src":"img/tool-vorschau.png","w":505,"alt":"Die Vorschau mit gelb markierten Platzhaltern."},{"src":"img/tool-pruefliste.png","w":505,"alt":"Die Prüfliste mit Hinweisen unter der Vorschau."},{"src":"img/tool-profil.png","w":280,"alt":"Die Schnellwahl mit den drei Möglichkeiten über den Häkchen."},{"src":"img/tool-layout.png","w":660,"alt":"Eine Word-Datei vor und nach dem Speichern mit Layout."}],"ds":[["I miei testi lasciano il computer?","No. TextAno elabora tutto nel tuo browser. Una politica di sicurezza nel file blocca le connessioni di rete della pagina (connect-src: tutto bloccato tranne il file della versione per la verifica degli aggiornamenti); non ci sono librerie esterne, telemetria o aggiornamenti automatici. TextAno non stabilisce mai di sua iniziativa una connessione a Internet. Unica eccezione è la verifica degli aggiornamenti, che avviene solo se la confermi espressamente – viene recuperato solo il numero di versione, non viene inviato nulla. Solo ciò che incolli tu stesso in uno strumento di IA arriva lì – decidi tu."],["Che cosa salva TextAno?","Solo impostazioni in questo browser: aspetto, modalità, lingua, livello di riconoscimento, IA scelta, caselle, licenza, presa d’atto dell’avviso e accettazione dell’EULA e, con licenza, logo e colori propri. Mai i tuoi testi o le corrispondenze. La modalità di apprendimento salva i nomi solo come somme di controllo salate. Tutti i dettagli in Protezione dei dati."],["L’anonimizzazione è sicura al 100 %?","No. Il riconoscimento si basa su regole, liste di parole e un piccolo modello – nessun metodo trova tutto. Per questo TextAno mostra una lista di controllo dei punti incerti e verifica prima della copia se nel testo restano valori originali. Controlla sempre tu il risultato prima di trasmetterlo. Finché la corrispondenza esiste, il testo è pseudonimizzato, non anonimo (EULA punto 9)."],["Posso usare testi anonimizzati in ChatGPT &amp; Co.?","Lo decidi tu. Un servizio di IA elabora ciò che incolli secondo le proprie condizioni e può salvarlo. I dati non riconosciuti vi arrivano in chiaro. Verifica prima se datore di lavoro, segreto professionale o d’ufficio e diritto della protezione dei dati lo permettono. La responsabilità della trasmissione resta tua (EULA punto 10)."],["Ho cancellato i dati del browser – che cosa è andato perso?","Impostazioni, licenza e stato di apprendimento si trovano solo in questo browser e sono persi. Conserva quindi il file di licenza o l’e-mail di risposta con la chiave di licenza; così reimporti la licenza in pochi secondi. Con licenza, «Salva il file con licenza» nella finestra della licenza crea un tuo file TextAno con la licenza integrata; se d’ora in poi apri questo file, non dovrai mai più inserire la licenza dopo aver cancellato i dati del browser. I testi non vanno persi, perché TextAno non li salva mai – salva tu i risultati in un file."]],"faq":[["Principi",[["Che cosa fa TextAno e a che cosa serve?","TextAno sostituisce nomi, indirizzi, numeri e altri dati personali nel tuo testo con segnaposto come [PERSON_1], prima che tu incolli il testo in uno strumento di IA come ChatGPT, Claude o Duck.ai. Poi TextAno ritraduce la risposta dell’IA: i segnaposto vengono sostituiti di nuovo con i valori originali. Così puoi usare l’IA senza rivelare dati personali."],["Come funziona?","Passo 1: incollare, digitare, importare o dettare il testo – TextAno anonimizza subito. Passo 2: verificare il risultato (lista di controllo, anteprima) e copiarlo o passarlo all’IA con «Copia e apri l’IA». Passo 3: incollare la risposta dell’IA – TextAno reinserisce i valori originali. Maggiori dettagli nelle Istruzioni."],["Perché TextAno è un unico file HTML?","Un file funziona in ogni browser aggiornato, senza installazione, senza account e senza server. Tutto ciò che serve a TextAno – riconoscimento, liste di parole, codice – è nel file. Puoi usarlo offline e decidi tu dove si trova."]]],["Protezione dei dati e sicurezza",[["I miei testi lasciano il computer?","No. TextAno elabora tutto nel tuo browser. Una politica di sicurezza nel file blocca le connessioni di rete della pagina (connect-src: tutto bloccato tranne il file della versione per la verifica degli aggiornamenti); non ci sono librerie esterne, telemetria o aggiornamenti automatici. TextAno non stabilisce mai di sua iniziativa una connessione a Internet. Unica eccezione è la verifica degli aggiornamenti, che avviene solo se la confermi espressamente – viene recuperato solo il numero di versione, non viene inviato nulla. Solo ciò che incolli tu stesso in uno strumento di IA arriva lì – decidi tu."],["Che cosa salva TextAno?","Solo impostazioni in questo browser: aspetto, modalità, lingua, livello di riconoscimento, IA scelta, caselle, licenza, presa d’atto dell’avviso e accettazione dell’EULA e, con licenza, logo e colori propri. Mai i tuoi testi o le corrispondenze. La modalità di apprendimento salva i nomi solo come somme di controllo salate. Tutti i dettagli in Protezione dei dati."],["L’anonimizzazione è sicura al 100 %?","No. Il riconoscimento si basa su regole, liste di parole e un piccolo modello – nessun metodo trova tutto. Per questo TextAno mostra una lista di controllo dei punti incerti e verifica prima della copia se nel testo restano valori originali. Controlla sempre tu il risultato prima di trasmetterlo. Finché la corrispondenza esiste, il testo è pseudonimizzato, non anonimo (EULA punto 9)."],["Posso usare testi anonimizzati in ChatGPT &amp; Co.?","Lo decidi tu. Un servizio di IA elabora ciò che incolli secondo le proprie condizioni e può salvarlo. I dati non riconosciuti vi arrivano in chiaro. Verifica prima se datore di lavoro, segreto professionale o d’ufficio e diritto della protezione dei dati lo permettono. La responsabilità della trasmissione resta tua (EULA punto 10)."],["Ho cancellato i dati del browser – che cosa è andato perso?","Impostazioni, licenza e stato di apprendimento si trovano solo in questo browser e sono persi. Conserva quindi il file di licenza o l’e-mail di risposta con la chiave di licenza; così reimporti la licenza in pochi secondi. Con licenza, «Salva il file con licenza» nella finestra della licenza crea un tuo file TextAno con la licenza integrata; se d’ora in poi apri questo file, non dovrai mai più inserire la licenza dopo aver cancellato i dati del browser. I testi non vanno persi, perché TextAno non li salva mai – salva tu i risultati in un file."]]],["Ritorno dopo l’IA",[["Come torna il testo dopo l’IA?","Incolla la risposta dell’IA al passo 3. TextAno sostituisce i segnaposto con i valori originali, anche se l’IA li ha leggermente modificati (p. es. «[Person 1]»). Se l’IA ha fornito un file Word, Excel, PowerPoint o OpenDocument, «Ritraduci un file» inserisce i valori direttamente nel file; il layout resta."],["Che cosa succede se chiudo la finestra?","La corrispondenza dei segnaposto esiste solo nella memoria di lavoro e sparisce alla chiusura o al ricaricamento. Dopo non è più possibile ritradurre una risposta dell’IA. Con licenza puoi prima salvare la corrispondenza cifrata (AES-256, con password) in un file e ricaricarla più tardi."]]],["Licenza e prezzi",[["Che differenza c’è tra modalità semplice e modalità esperto?","La modalità semplice (modalità gratuita) usa impostazioni standard collaudate: incollare testo o importare file .txt e .md, anonimizzare, verificare, ritradurre e salvare. La modalità esperto richiede una licenza e offre tra l’altro categorie, termini propri, eccezioni, modalità di apprendimento, importazione di file PDF, Office ed e-mail, corrispondenza cifrata nonché logo e colori propri. Riconoscimento di base, lista di controllo e verifica di sicurezza sono uguali nelle due modalità."],["Posso usare la versione gratuita per lavoro?","No. La versione gratuita è solo per scopi privati. Per l’uso nella professione, in azienda, in un’amministrazione, a scuola o in un’associazione serve una licenza (vedi EULA)."],["Quanto costa una licenza e come la ordino?","I prezzi attuali sono in Prezzi delle licenze – in CHF, EUR o USD, come licenza mensile o annuale, per le aziende per collaboratore a scaglioni. Con «Ordinare ora» prepari un ordine completo e lo invii per e-mail a \u003ca href=\"mailto:textano@protonmail.com\">textano@protonmail.com\u003c/a>. La licenza arriva per e-mail; la incolli in «Licenza»."],["Come rinnovo o aggiungo collaboratori?","Nella finestra d’ordine scegli «Rinnovo», «Passaggio mese → anno» o «Collaboratori aggiuntivi». Una licenza non si rinnova mai automaticamente. Alla scadenza TextAno continua come versione gratuita; i tuoi testi e le funzioni gratuite restano."],["Come pago?","Paghi nella valuta scelta (CHF, EUR o USD) al prezzo indicato nel tuo ordine. I dati di pagamento li ricevi con la risposta al tuo ordine; la licenza viene emessa dopo il pagamento."]]],["Chi c’è dietro",[["Chi c’è dietro TextAno?","Peter Haller, una persona singola in Svizzera. TextAno è il suo progetto privato e non ha alcun legame con i suoi datori di lavoro. Di più in Chi sono."],["Quale filosofia guida TextAno?","Prima la protezione dei dati: tutto in locale, nessun account, nessun tracciamento, nessuna pubblicità, nessuna raccolta di dati e nessuna dipendenza da server o librerie esterne. TextAno è indipendente e non è legato ad alcun fornitore di IA; i servizi di IA nell’elenco sono solo scorciatoie ai loro siti. I limiti del riconoscimento sono dichiarati apertamente."],["TextAno è certificato o verificato?","No. TextAno è uno strumento di supporto, non certificato, e non sostituisce né il controllo umano né una consulenza giuridica o sulla protezione dei dati."]]],["Supporto e aggiornamenti",[["Come ottengo aiuto o segnalo un errore?","Per e-mail a \u003ca href=\"mailto:textano@protonmail.com\">textano@protonmail.com\u003c/a>. Il supporto è una prestazione volontaria (EULA punto 7). Indica: numero di versione (piè di pagina), browser e dispositivo, che cosa hai fatto e che cosa è successo. Non inviare mai il testo originale – al massimo un esempio inventato o anonimizzato che mostri l’errore."],["Come ricevo gli aggiornamenti?","TextAno non si aggiorna mai da solo e non scarica nulla dalla rete di sua iniziativa. Con «Cerca aggiornamenti» nel piè di pagina verifichi, dopo la tua conferma, se esiste una versione più recente; «Scarica» apre la cartella pubblica delle versioni con il file attuale. Il licenziante mette a disposizione nuove versioni a sua discrezione (EULA punto 7). Il numero di versione è nel piè di pagina, le modifiche nelle Release Notes. Se impostazioni e licenza vengono riprese nel nuovo file dipende dal browser – tieni a portata di mano la licenza."]]],["Tecnica",[["Quali browser e dispositivi sono supportati?","Le versioni aggiornate di Chrome, Edge e Firefox sul computer e il browser del telefono. Safari non è verificato in modo sistematico. La dettatura funziona solo se il browser offre il riconoscimento vocale sul dispositivo stesso (attualmente Chrome ed Edge); altrimenti il pulsante resta bloccato."],["Quali file può importare TextAno?","Gratis: .txt e .md. Con licenza inoltre PDF, Word, Excel, PowerPoint, OpenDocument, RTF, CSV, JSON, HTML, XML, e-mail (.eml, .msg) e altri formati di testo. Puoi salvare come testo o Word, con licenza anche file Office con layout."],["Quali lingue conosce TextAno?","Interfaccia e riconoscimento: tedesco, francese, italiano e inglese. La lingua del testo viene riconosciuta automaticamente o si può scegliere. Dati svizzeri come numero AVS, IDI, targa e NPA vengono riconosciuti."],["TextAno è accessibile?","TextAno si usa con la tastiera, ha etichette per i lettori di schermo e una modalità chiara e scura. Non tutto è ancora ideale (p. es. caselle piccole); i miglioramenti sono in corso, i tuoi riscontri sono benvenuti."]]],["Note legali",[["Quali testi giuridici valgono?","L’EULA e l’Avviso importante. Si applica il diritto svizzero, il foro è Baden, nella misura consentita dalla legge. La responsabilità è esclusa nella misura consentita dalla legge; non c’è esclusione per dolo e colpa grave. In caso di dubbio prevale il testo dell’EULA su questa FAQ."]]]],"ueb":{"titel":"Chi sono","name":"Peter Haller","rolle":"Sviluppatore di TextAno · Baden AG, Svizzera","lead":"Dal 2006 lavoro nell’amministrazione pubblica in Argovia – con dati fiscali e finanziari per i quali la riservatezza non è un’opzione, ma un obbligo. Con questa esigenza è nato TextAno: usare l’IA senza rivelare dati personali.","wH":"Percorso professionale","w":[["dal 2012","Capo delle finanze sostituto, amministrazione cittadina di Mellingen"],["2006–2012","Amministrazione comunale di Neuenhof: esperto di tassazione, amministrazione delle finanze, da ultimo capo delle finanze"],["2005–2006","Supporto informatico (hardware e software, rete server-client)"]],"aH":"Formazione e perfezionamento","a":[["2018–2020","Attestato professionale federale in finanza e contabilità (zB. Zentrum Bildung)"],["2009–2010","Esame professionale superiore per quadri comunali, indirizzo specialisti delle finanze (Höhere Verwaltungsfachschule IPM)"],["2008–2009","Corso di base per il personale comunale argoviese (IPM)"],["2007–2008","Impiegato specializzato in contabilità (zB. Zentrum Bildung)"],["2005–2006","Quadro di livello gruppo/team (SVF-ASFC), ICT Power-User SIZ, diplomi di lingua FIRST e DELF"],["2002–2005","Impiegato di commercio con maturità professionale (zB. Zentrum Bildung)"]],"nH":"Cariche accessorie","n":[["dal 2024","Rappresentanza dei comuni, gruppo specialistico riscossione delle imposte, Canton Argovia"],["dal 2021","Perito all’esame federale «Specialista in finanza e contabilità con attestato professionale federale» (Associazione per gli esami superiori in contabilità e controlling)"],["dal 2016","Membro del comitato (attuario), associazione degli amministratori delle finanze del distretto di Baden"],["2009–2012","Revisore, asilo nido Kinderhort Neuenhof"]],"vH":"Su che cosa puoi contare","v":[["100 % locale","Nessun server, nessun cloud, nessuna connessione senza il tuo consenso. I tuoi testi non lasciano il tuo browser."],["Fornitore svizzero","Il licenziante è una persona singola in Svizzera, diritto svizzero, foro a Baden."],["Contatto diretto","Nessun call center: il tuo messaggio arriva direttamente a me."]],"li":"Profilo LinkedIn","hinweis":"TextAno è il mio progetto privato e non ha alcun legame con i miei datori di lavoro.","foto":"Ritratto di Peter Haller"},"copy":"© 2026 Peter Haller"},"en":{"t":{"lang":"en","title":"TextAno – anonymise texts before they go to AI","desc":"TextAno replaces names, addresses and numbers with placeholders before you give a text to ChatGPT, Claude & co. – and restores the answer afterwards. Everything local in the browser.","nav":["Features","Demo","Pricing","About me","FAQ","Contact"],"skip":"Skip to content","theme":"Toggle light/dark","langLabel":"Language","heroH":"Anonymise texts before they go to AI – entirely local.","heroP":"TextAno replaces personal data with placeholders such as [PERSON_1] before your text goes to ChatGPT, Claude or Duck.ai – and restores the AI's answer afterwards. No server, no account, no installation.","ctaDemo":"Try the demo","ctaMail":"Request TextAno by email","ctaRel":"Download (release folder)","warumH":"Why TextAno","stepsH":"How it works","demoH":"Demo","demoP":"Try the detection right here – with an invented sample text. The demo runs only in your browser, sends nothing and stores nothing.","demoFrame":"TextAno demo","funkH":"Features","gratisH":"Simple mode (free, private)","expertH":"Expert mode (licence)","badgeFrei":"Simple mode","badgeLiz":"Expert mode","shotsH":"A look at the tool","dsH":"Privacy","dsP":"TextAno works in your browser. The file blocks network connections; the only exception is the update check, and only after your click and confirmation.","preisH":"Pricing","waehrung":"Currency","privatH":"Private","firmaH":"Companies (per employee)","einfach":"Simple mode (free)","experte":"Expert mode","monat":"per month","jahr":"per year","ab":"From","stufe":"employees","gratisW":"free","preisNote":"Tiered pricing: each tier applies to the employees within that tier. No VAT. EUR/USD converted at the ECB reference rate of {d}. Companies always need expert mode. Order directly in the tool (window “Licence prices” → Order) or by email.","getH":"How to get TextAno","getP":"Write to {m} – you will receive the current TextAno file and, if you wish, a licence. The current version is also in the public release folder.","getMail":"Write an email","ueberH":"About me","faqH":"Frequently asked questions","faqSuche":"Search the questions","faqKeine":"No question matches.","rechtH":"Legal","rechtP":"Use of TextAno is governed by the end user licence agreement (EULA) and the liability notice, which you confirm when you first start the tool.","kontaktH":"Contact","stand":"TextAno version {v}, {d}","neuTab":"(opens in a new tab)","foot":"This website uses no cookies, no trackers and loads nothing from third-party servers. When accessed via GitHub Pages, GitHub technically sees your IP address."},"steps":["Paste, type, import or dictate the text – TextAno anonymises it at once.","Check the result (checklist, preview) and copy it or pass it to the AI with “Copy & open AI”.","Paste the AI’s answer – TextAno puts the original values back. More in the Guide."],"produkt":"\u003cp>\u003cstrong>TextAno prepares texts before they go to an external AI such as ChatGPT or Claude.\u003c/strong> It searches for personal and confidential information, replaces what it finds with neutral placeholders and puts the values back into the AI’s answer.\u003c/p>\u003cul>\u003cli>\u003cstrong>Local:\u003c/strong> processing in your browser; the file blocks network connections.\u003c/li>\u003cli>\u003cstrong>Full control:\u003c/strong> you see every replacement and can undo, add or change it.\u003c/li>\u003cli>\u003cstrong>Review and correct:\u003c/strong> review list, marking of missed items and residual risk indicator.\u003c/li>\u003cli>\u003cstrong>Independent:\u003c/strong> no external AI or anonymisation interface needed, no installation.\u003c/li>\u003c/ul>\u003cp>Your data. Your control. Your decision.\u003cbr>Automation supports. People decide.\u003c/p>","gratis":"\u003ch4>Free version\u003c/h4>\u003cp>You are using the simple mode free of charge for private purposes: paste text or import text files (.txt, .md), anonymise, check, translate back and save as text or Word. Business use (work, company, public authority, school, association) requires a licence; it also unlocks the expert mode, with learning mode, importing PDF, Word, Excel, PowerPoint, OpenDocument, RTF and e-mail files as well as your own logo and colours. Basic detection, security check and warnings are the same in the free version; learned names only take effect with a licence. Processing stays local.\u003c/p>\u003cp>Order a licence: \u003ca href=\"mailto:textano@protonmail.com\">textano@protonmail.com\u003c/a> · \u003ca href=\"#preise\">Licence prices and order\u003c/a>\u003c/p>","expert":"\u003cp>\u003cstrong>Expert mode (with licence):\u003c/strong> learning mode (learn locally, manage learned data, list of names), importing PDF, Word, Excel, PowerPoint, OpenDocument, RTF, e-mail and CSV files, categories and quick selection, options (mapping across several texts, remove original text, automatic deletion, note for the AI, pseudonyms and date shifting, sensitive terms), own terms and patterns, exceptions, showing the mapping and saving it encrypted or loading it, review log, self-test and info on saving with layout. Plus your own logo and colours. The licence also permits business use.\u003c/p>\u003cp>\u003cstrong>Free without a licence:\u003c/strong> text field, importing text files (.txt, .md), anonymising, review list, undo, copy &amp; open AI, back-translation, saving as text or Word and “Reset learned data”.\u003c/p>","hinweis":"\u003ch4>Important notice\u003c/h4>\u003cp>TextAno helps you detect and replace personal and confidential information. Despite careful development, content can be missed, misidentified or replaced incompletely.\u003c/p>\u003cp>Check the result carefully before passing it on. The software does not replace your own review and does not guarantee complete or legally compliant anonymisation. You are responsible for the final review and for the decision to pass the text on.\u003c/p>","funk":[{"k":"opt_live","h":"Anonymise live","p":"The result is created while you type: after a short pause the detection runs by itself. Pasting, reading a file and changed settings (categories, detection, text language, lists) take effect at once. “Anonymise now” calculates without a pause.","liz":false},{"k":"vorschau","h":"Preview and correction","p":"Shows every replacement in yellow. A click on a yellow placeholder restores the original value; if the same placeholder occurs several times in the result, the tool asks: only this place or all of them.","liz":false},{"k":"pruefliste","h":"Review list","p":"Shows spots that look like names or sensitive details but were not replaced. A click replaces the spot, ✕ hides it. Dashed means: unknown word, only a hint.","liz":false},{"k":"katStufe","h":"Categories: fine or broad","p":"Only decides the names of the placeholders, not what is replaced. Fine (default) tells the AI exactly what is at a place, for example [STRASSE_1], [GEBURTSDATUM_1] or [VERSICHERTENNUMMER_1].","liz":false},{"k":"opt_leg","h":"Details for the AI","p":"Adds a short list for the AI when copying: man, woman or unknown, and whether a name is first and last name, first name only or last name only. Plus the placeholders for the last name alone.","liz":false},{"k":"auftrag","h":"Task","p":"Copies a ready-made sentence such as “Summarise the following text in a few sentences.” in front of the text. The language follows the interface.","liz":false},{"k":"textLang","h":"Text language","p":"“Detect automatically” determines the language of the text and picks the matching rules. A fixed language turns that off, “All languages” uses all rules at once.","liz":false},{"k":"strenge","h":"Detection: Normal or Strict","p":"Normal replaces what looks like personal data, including words a small language model in the browser classifies as names. Strict also replaces every word not on the word list and any foreign script.","liz":false},{"k":"opt_fkt","h":"Generalise functions and offices","p":"Replaces political offices and leading functions at a named institution entirely with [FUNKTION_1], for example “member of the city council”, “Kantonsrätin” before a name or “chief physician at [SPITAL_1]”.","liz":false},{"k":"lernen","h":"Learning mode","p":"The tool remembers replaced names as unreadable checksums and recognises them in later texts even without a salutation. Within one text this already happens without learning mode.","liz":true},{"k":"begriffe","h":"Custom terms","p":"Every line is always replaced, regardless of upper and lower case.","liz":true},{"k":"ausnahmen","h":"Exceptions","p":"Entries always stay. Exceptions take priority over all rules.","liz":true},{"k":"layout","h":"Save and “With layout”","p":"TXT and Word save th
